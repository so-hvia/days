<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скільки днів я люблю свого мужчіну</title>
    <style>
        /* CSS для розташування елементів по центру */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Чисто біле тло */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Розвертає вміст на всю висоту екрана */
        }

        .container {
            text-align: center; /* Центрує картинку та текст всередині */
            padding: 20px;
        }

        /* Налаштування картинки посередині */
       .center-image {
            max-width: 400px; /* Максимальна ширина картинки */
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 30px auto; /* Центрує картинку та робить відступ знизу */
        }

        /* Налаштування вигляду таймера */
        .timer-display {
            font-size: 28px; /* Розмір шрифту */
            font-weight: bold;
            color: #9B0116; /* Червоний колір для цифр */
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Замініть image.jpg на посилання або назву вашої картинки -->
        <img src="photo.png" alt="Головне зображення" class="center-image">
        
        <!-- Сюди скрипт виводитиме час -->
        <div class="timer-display" id="timer">Завантаження...</div>
    </div>

    <script>
        // === НАЛАШТУВАННЯ ДАТИ ===
        // Вкажіть дату, ВІД якої рахувати час (Рік, Місяць - 1, День, Година, Хвилина)
        // УВАГА: Місяці в JavaScript рахуються з 0 до 11 (0 - січень, 1 - лютий, ..., 6 - липень тощо)
        // Наприклад, 15 липня 2024 року о 12:00 запишеться як: Date.UTC(2024, 6, 15, 12, 0, 0)
        const startDate = new Date(Date.UTC(2021, 8, 6, 18, 5, 6)); 

        function updateTimer() {
            const now = new Date();
            let diff = now - startDate;

            if (diff < 0) {
                document.getElementById('timer').innerHTML = "Вказана дата ще не настала!";
                return;
            }

            // Розрахунок років, місяців, днів, годин, хвилин та секунд
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            let hours = now.getHours() - startDate.getHours();
            let minutes = now.getMinutes() - startDate.getMinutes();
            let seconds = now.getSeconds() - startDate.getSeconds();

            // Коригування негативних значень через різну кількість днів у місяцях
             if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) {
                const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += previousMonth.getDate();
                months--;
            }
            if (months < 0) { months += 12; years--; }

            // Виведення результату на екран
            document.getElementById('timer').innerHTML = 
                `${years}р. ${months}міс. ${days}д. ${hours}год. ${minutes}хв.`;
        }

        // Запуск таймера щохвилини
        updateTimer();
        setInterval(updateTimer, 60000); 
    </script>

</body>
</html>
