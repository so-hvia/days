<!DOCTYPE html> 
<html lang="uk"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Скільки днів я люблю Сашулю</title> 

    <!-- Виправлене та надійне підключення шрифту Manrope з Google Fonts --> 
    <link rel="preconnect" href="https://googleapis.com"> 
    <link rel="preconnect" href="https://gstatic.com" crossorigin> 
    <link href="https://googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet"> 
    <link rel="icon" href="calendar.png" type="image/png" sizes="36x36">

    <style> 
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #ffffff; 
            /* Примусово задаємо Manrope для всього сайту */
            font-family: 'Manrope', sans-serif !important; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        } 

        .container { 
            text-align: center; 
            padding: 20px; 
            position: relative;
            z-index: 10;
        } 

        .center-image { 
            max-width: 400px; 
            width: 100%; 
            height: auto; 
            display: block; 
            margin: 0 auto 30px auto; 
        } 

        /* Заголовок H1 з новою білою плашкою */ 
        h1 { 
            font-size: 24px; 
            font-weight: 700 !important; 
            color: #333333; 
            margin: 0 auto 15px auto; 
            padding: 10px 20px;
            background: #ffffff; /* Біле тло для тексту */
            border-radius: 8px;   /* Легке закруглення плашки */
            display: inline-block;
        } 

        /* Налаштування вигляду таймера */ 
        .timer-display { 
            font-size: 32px; 
            /* Виправлено: тепер тут точно Manrope замість Inter */
            font-family: 'Manrope', sans-serif !important; 
            font-weight: 600 !important; 
            color: #9B0116; 
            letter-spacing: 0.5px; 
            padding: 15px 25px; 
            background: #ffffff; 
            border-radius: 12px; 
            display: inline-block; 
            transition: transform 0.4s ease; 
            cursor: default; 
        } 

        .timer-display span { 
            font-size: 20px; 
            font-weight: 600 !important; 
            color: #9B0116; 
            margin-right: 8px; 
        } 

        /* Погойдування таймера */ 
        .timer-display:hover { 
            animation: wobble-box 0.6s ease-in-out forwards; 
        } 

        @keyframes wobble-box { 
            0% { transform: rotate(0deg); } 
            30% { transform: rotate(3deg); } 
            70% { transform: rotate(-2deg); } 
            100% { transform: rotate(0deg); } 
        } 

        /* Налаштування анімації поцілунків */
        .heart {
            position: absolute;
            bottom: -80px; 
            user-select: none;
            pointer-events: none;
            animation: flyAndFade 5s linear forwards; 
        }

        .heart img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes flyAndFade {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.9; 
            }
            50% {
                transform: translateY(-50vh) translateX(50px) rotate(20deg);
                opacity: 0.6; 
            }
            100% {
                transform: translateY(-110vh) translateX(-50px) rotate(-20deg);
                opacity: 0; 
            }
        }
    </style> 
</head> 
<body> 

    <div class="container"> 
        <img src="photo.png" alt="Головне зображення" class="center-image"> 
        
        <!-- Заголовок H1 на плашці --> 
        <div>
            <h1>Я найщасливіша дівчина в світі вже:</h1> 
        </div>

        <!-- Таймер з плашкою --> 
        <div class="timer-display" id="timer">Завантаження...</div> 
    </div> 

    <script> 
        const startDate = new Date(Date.UTC(2021, 8, 6, 18, 56, 0)); 

        function getPluralWord(number, one, two, many) { 
            let n = Math.abs(number); 
            n %= 100; 
            if (n >= 5 && n <= 20) return many; 
            n %= 10; 
            if (n === 1) return one; 
            if (n >= 2 && n <= 4) return two; 
            return many; 
        } 

        function updateTimer() { 
            const now = new Date(); 
            let diff = now - startDate; 

            if (diff < 0) { 
                document.getElementById('timer').innerHTML = "Вказана дата ще не настала!"; 
                return; 
            } 

            let years = now.getFullYear() - startDate.getFullYear(); 
            let months = now.getMonth() - startDate.getMonth(); 
            let days = now.getDate() - startDate.getDate(); 
            let hours = now.getHours() - startDate.getHours(); 
            let minutes = now.getMinutes() - startDate.getMinutes(); 
            let seconds = now.getSeconds() - startDate.getSeconds(); 

            if (seconds < 0) { seconds += 60; minutes--; } 
            if (minutes < 0) { minutes += 60; hours--; } 
            if (hours < 0) { hours += 24; days--; } 
            if (days < 0) { 
                const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0); 
                days += previousMonth.getDate(); 
                months--; 
            } 
            if (months < 0) { months += 12; years--; } 

            let txtYears = getPluralWord(years, "рік", "роки", "років"); 
            let txtMonths = getPluralWord(months, "місяць", "місяці", "місяців"); 
            let txtDays = getPluralWord(days, "день", "дні", "днів"); 
            let txtHours = getPluralWord(hours, "година", "години", "годин"); 
            let txtMinutes = getPluralWord(minutes, "хвилина", "хвилини", "хвилин"); 
            let txtSeconds = getPluralWord(seconds, "секунда", "секунди", "секунд"); 

            document.getElementById('timer').innerHTML = 
                `${years}<span> ${txtYears}</span> ` + 
                `${months}<span> ${txtMonths}</span> ` + 
                `${days}<span> ${txtDays}</span> ` + 
                `${hours}<span> ${txtHours}</span> ` + 
                `${minutes}<span> ${txtMinutes}</span> ` + 
                `${seconds}<span> ${txtSeconds}</span>`; 
        } 

        updateTimer(); 
        setInterval(updateTimer, 1000); 

        function spawnKiss() {
            const kiss = document.createElement('div');
            kiss.className = 'heart';
            kiss.innerHTML = '<img src="kiss.png" alt="kiss">'; 
            
            kiss.style.left = Math.random() * 100 + 'vw'; 
            
            const size = Math.random() * 30 + 35; 
            kiss.style.width = size + 'px'; 
            
            const duration = Math.random() * 2 + 4; 
            kiss.style.animationDuration = duration + 's'; 
            
            document.body.appendChild(kiss); 
            
            setTimeout(() => { 
                kiss.remove(); 
            }, duration * 1000); 
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Пришвидшили створення нових картинок до 150мс для більшої кількості
            setInterval(spawnKiss, 150); 
        });
    </script> 
</body> 
</html>
