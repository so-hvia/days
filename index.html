<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скільки днів я люблю свого мужчіну</title>
    
    <!-- Підключаємо шрифт Inter з Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Manrope:wght@700;600&display=swap" rel="stylesheet">

    <style>
         @import url('https://googleapis.com');
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; 
            font-family: 'Manrope', sans-serif; /* Застосовуємо новий шрифт */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
        }

        .container {
            text-align: center; 
            padding: 20px;
        }

        .center-image {
            max-width: 400px; 
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 30px auto; 
        }

        /* Заголовок H1 над таймером */
        h1 {
            font-size: 24px;
            font-weight: 700; /* Товщина Inter 700 */
            color: #333333; /* Темно-сірий колір */
            margin: 0 0 15px 0;
        }

        /* Налаштування вигляду таймера */
        .timer-display {
            font-size: 32px; /* Збільшили розмір самих цифр */
            font-family: 'Inter', sans-serif !important;
            font-weight: 600 !important; 
            color: #9B0116; 
            letter-spacing: 0.5px;
            padding: 15px 25px;
            background: #ffffff; 
            border-radius: 12px;
            display: inline-block;
            transition: transform 0.4s ease; 
            cursor: default;
        }

        .timer-display span {
            font-size: 20px; /* Зменшений розмір для тексту порівняно з цифрами */
            font-weight: 600;
            color: #9B0116;
            margin-right: 8px; /* Відступ після кожного слова */
        }

        /* Ефект погойдування плашки при наведенні (спочатку один край, потім інший) */
        .timer-display:hover {
            animation: wobble-box 0.6s ease-in-out forwards;
        }

        @keyframes wobble-box {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(3deg); }   /* Нахил в один бік */
            70% { transform: rotate(-2deg); } /* Потім нахил в інший бік */
            100% { transform: rotate(0deg); }  /* Повернення до центру */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="photo.png" alt="Головне зображення" class="center-image">
        
        <!-- Заголовок H1 -->
        <h1>Я найщасливіша дівчина в світі вже:</h1>
        
        <!-- Таймер з плашкою -->
        <div class="timer-display" id="timer">Завантаження...</div>
    </div>

    <script>
        // Дата: 6 вересня 2021 року, 18:05:06
        const startDate = new Date(Date.UTC(2021, 8, 6, 18, 5, 6)); 
        
         function getPluralWord(number, one, two, many) {
            let n = Math.abs(number);
            n %= 100;
            if (n >= 5 && n <= 20) return many;
            n %= 10;
            if (n === 1) return one;
            if (n >= 2 && n <= 4) return two;
            return many;
        }

        function updateTimer() {
            const now = new Date();
            let diff = now - startDate;

            if (diff < 0) {
                document.getElementById('timer').innerHTML = "Вказана дата ще не настала!";
                return;
            }

            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            let hours = now.getHours() - startDate.getHours();
            let minutes = now.getMinutes() - startDate.getMinutes();
            let seconds = now.getSeconds() - startDate.getSeconds();

            if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) {
                const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += previousMonth.getDate();
                months--;
            }
            if (months < 0) { months += 12; years--; }
            
       // Отримуємо правильні закінчення для кожного слова
             let txtYears = getPluralWord(years, "рік", "роки", "років");
            let txtMonths = getPluralWord(months, "місяць", "місяці", "місяців");
            let txtDays = getPluralWord(days, "день", "дні", "днів");
            let txtHours = getPluralWord(hours, "година", "години", "годин");
            let txtMinutes = getPluralWord(minutes, "хвилина", "хвилини", "хвилин");
            let txtSeconds = getPluralWord(seconds, "секунда", "секунди", "секунд");

            
            // Виводимо цифри великими, а слова загортаємо в <span> для зменшення
            document.getElementById('timer').innerHTML = 
                `${years}<span> ${txtYears}</span> ` +
                `${months}<span> ${txtMonths}</span> ` +
                `${days}<span> ${txtDays}</span> ` +
                `${hours}<span> ${txtHours}</span> ` +
                `${minutes}<span> ${txtMinutes}</span> ` +
                `${seconds}<span> ${txtSeconds}</span>`;
        }
            
            // Додали змінну `${seconds}с.` у виведення тексту
            document.getElementById('timer').innerHTML = 
                `${years}р. ${months}міс. ${days}д. ${hours}год. ${minutes}хв. ${seconds}с.`;
        }

        // Головне виправлення: тепер таймер оновлюється кожну 1 секунду (1000 мс), тому секунди йдуть в реальному часі
        updateTimer();
        setInterval(updateTimer, 1000); 

  function createHearts() {
            const numberOfHearts = 45; 
            
            for (let i = 0; i < numberOfHearts; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️'; 
                    
                    heart.style.left = Math.random() * 100 + 'vw';
                    
                    const size = Math.random() * 20 + 15; 
                    heart.style.fontSize = size + 'px';
                    
                    const duration = Math.random() * 2 + 3; 
                    heart.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.remove();
                    }, duration * 1000);
                    
                }, i * 120); 
            }
        }
        window.addEventListener('DOMContentLoaded', createHearts);
        
    </script>

</body>
</html>
