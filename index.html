<!DOCTYPE html> 
<html lang="uk"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Скільки днів я люблю Сашулю</title> 

    <!-- Надійне підключення шрифту Manrope з Google Fonts --> 
    <link rel="preconnect" href="https://googleapis.com"> 
    <link rel="preconnect" href="https://gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"> 
    <link rel="icon" href="calendar.png" type="image/png" sizes="36x36"> 

    <style> 
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #ffffff; 
            font-family: 'Manrope', sans-serif !important; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative; 
        } 

        .container { 
            text-align: center; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
        } 

        .center-image { 
            max-width: 360px; 
            width: 100%; 
            height: auto; 
            display: block; 
            margin: 0 auto 20px auto; 
        } 

        /* Заголовок H1 з білою плашкою */ 
        h1 { 
            font-size: 32px; 
            font-weight: 500 !important; 
            color: #2A2823; 
            margin: 0 auto; 
            padding: 15px 25px 5px 25px; 
            background: #ffffff; 
            border-radius: 12px 12px 0 0; 
            display: inline-block; 
        } 

        /* Ідеальний вигляд головної плашки таймера */ 
        .timer-display { 
            background: #ffffff; 
            border-radius: 12px 12px 12px 12px; 
            padding: 5px 25px 20px 25px; 
            margin: 0 auto; 
            
            /* Шикуємо елементи в один рівний горизонтальний ряд по центру */
            display: flex !important; 
            flex-direction: row !important;
            justify-content: center;
            align-items: center;
            
            cursor: default; 
        } 

        /* Окремий стовпчик для кожної пари (Цифра + Слово) */
        .timer-item {
            display: flex;
            flex-direction: column; /* Цифра строго над словом */
            align-items: center;    /* Центруємо їх відносно один одного */
            width: 90px;           /* Фіксована ширина прибрала здригання плашки */
            margin: 0 12px;         /* Красива гармонійна відстань між стовпчиками */
        }

        /* Стилі для великих цифр */
        .timer-num {
            font-size: 36px; 
            font-weight: 700 !important; 
            color: #9B0116; 
            letter-spacing: 0.5px; 
            font-variant-numeric: tabular-nums; /* Цифри однакової ширини */
        }

        /* Стилі для підписів слів знизу */ 
        .timer-word { 
            font-size: 25px; 
            font-weight: 700 !important; 
            color: #9B0116; 
            margin-top: 5px; /* Акуратний відступ між цифрою та текстом */
            text-align: center;
        } 

        /* Анімація поцілунків */ 
        .heart { 
            position: absolute; 
            bottom: -80px; 
            user-select: none; 
            pointer-events: none; 
        } 

        .heart img { 
            width: 100%; 
            height: auto; 
            display: block; 
        } 

        .fly-straight { animation: straightMove 5s linear forwards; } 
        .fly-left { animation: leftMove 5s linear forwards; } 
        .fly-right { animation: rightMove 5s linear forwards; } 

        @keyframes straightMove { 
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; } 
            85% { opacity: 0.8; } 
            100% { transform: translateY(-115vh) rotate(15deg); opacity: 0; } 
        } 

        @keyframes leftMove { 
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.9; } 
            85% { opacity: 0.8; } 
            100% { transform: translateY(-115vh) translateX(-15vw) rotate(-35deg); opacity: 0; } 
        } 

        @keyframes rightMove { 
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.9; } 
            85% { opacity: 0.8; } 
            100% { transform: translateY(-115vh) translateX(15vw) rotate(35deg); opacity: 0; } 
        } 

        /* === НАЛАШТУВАННЯ ДЛЯ МОБІЛЬНИХ ТЕЛЕФОНІВ (екран менше 768px) === */
        @media (max-width: 768px) {
            /* Примусове центрування всього контенту на екрані телефона */
            .container {
                align-items: center !important;
                justify-content: center !important;
                padding: 10px;
                width: 100%;
                box-sizing: border-box;
            }

            /* Зменшуємо максимальну ширину головного фото, щоб воно красиво виглядало на смартфонах */
            .center-image {
                max-width: 280px;
                margin-bottom: 15px;
            }

            /* Центруємо H1 на телефоні та прибираємо фонову плашку, бо блоки таймера тепер окремо */
            h1 {
                font-size: 24px; /* Трохи зменшуємо шрифт для мобілок */
                text-align: center;
                background: transparent; 
                padding: 10px;
                margin-bottom: 15px;
                display: block;
            }

            /* Перетворюємо таймер на вертикальний стовпчик без спільного білого тла */
            .timer-display {
                flex-direction: column !important; /* Блоки йдуть строго вертикально */
                background: transparent; /* Прибираємо спільну довгу плашку */
                padding: 0;
                width: 100%;
                align-items: center;
            }

            /* Створюємо ОКРЕМУ плашку для кожної пари (Цифра + Текст) */
            .timer-item {
                background: #ffffff; /* Біле тло для кожної окремої цифри */
                border-radius: 12px;  /* Гарне закруглення кутів */
                padding: 12px 20px;   /* Внутрішні відступи */
                width: 200px;         /* Фіксована ширина кожної плашки */
                margin: 8px 0 !important; /* Відстань (відступ) між плашками */
                box-shadow: 0 2px 8px rgba(0,0,0,0.04); /* Легка тінь для об'єму */
            }

            /* Трохи коригуємо розміри шрифтів на телефоні */
            .timer-num {
                font-size: 32px;
            }
            .timer-word {
                font-size: 18px;
            }
        }
    </style> 
</head> 
<body> 

    <div class="container"> 
        <img src="photo.png" alt="Головне зображення" class="center-image"> 
        
        <!-- Заголовок H1 --> 
        <h1>Я найщасливіша дівчина в світі вже:</h1> 
        
        <!-- Оновлений горизонтальний таймер --> 
        <div class="timer-display" id="timer">Завантаження...</div> 
    </div> 

    <script> 
        const startDate = new Date(Date.UTC(2021, 8, 6, 18, 56, 0)); 

        function getPluralWord(number, one, two, many) { 
            let n = Math.abs(number); 
            n %= 100; 
            if (n >= 5 && n <= 20) return many; 
            n %= 10; 
            if (n === 1) return one; 
            if (n >= 2 && n <= 4) return two; 
            return many; 
        } 

        function updateTimer() { 
            const now = new Date(); 
            let diff = now - startDate; 

            if (diff < 0) { 
                document.getElementById('timer').innerHTML = "Вказана дата ще не настала!"; 
                return; 
            } 

            let years = now.getFullYear() - startDate.getFullYear(); 
            let months = now.getMonth() - startDate.getMonth(); 
            let days = now.getDate() - startDate.getDate(); 
            let hours = now.getHours() - startDate.getHours(); 
            let minutes = now.getMinutes() - startDate.getMinutes(); 
            let seconds = now.getSeconds() - startDate.getSeconds(); 

            if (seconds < 0) { seconds += 60; minutes--; } 
            if (minutes < 0) { minutes += 60; hours--; } 
            if (hours < 0) { hours += 24; days--; } 
            if (days < 0) { 
                const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0); 
                days += previousMonth.getDate(); 
                months--; 
            } 
            if (months < 0) { months += 12; years--; } 

            let txtYears = getPluralWord(years, "рік", "роки", "років"); 
            let txtMonths = getPluralWord(months, "місяць", "місяці", "місяців"); 
            let txtDays = getPluralWord(days, "день", "дні", "днів"); 
            let txtHours = getPluralWord(hours, "година", "години", "годин"); 
            let txtMinutes = getPluralWord(minutes, "хвилина", "хвилини", "хвилин"); 
            let txtSeconds = getPluralWord(seconds, "секунда", "секунди", "секунд"); 

            // Оновлена чиста структура виведення блоків
            document.getElementById('timer').innerHTML = 
                `<div class="timer-item"><div class="timer-num">${years}</div><div class="timer-word">${txtYears}</div></div>` + 
                `<div class="timer-item"><div class="timer-num">${months}</div><div class="timer-word">${txtMonths}</div></div>` + 
                `<div class="timer-item"><div class="timer-num">${days}</div><div class="timer-word">${txtDays}</div></div>` + 
                `<div class="timer-item"><div class="timer-num">${hours}</div><div class="timer-word">${txtHours}</div></div>` + 
                `<div class="timer-item"><div class="timer-num">${minutes}</div><div class="timer-word">${txtMinutes}</div></div>` + 
                `<div class="timer-item"><div class="timer-num">${seconds}</div><div class="timer-word">${txtSeconds}</div></div>`; 
        } 

        updateTimer(); 
        setInterval(updateTimer, 1000); 

        function checkAnniversary() {
            const now = new Date();
            const isSeptember6 = (now.getMonth() === 8 && now.getDate() === 6);
            const isAfterTime = (now.getHours() > 18 || (now.getHours() === 18 && now.getMinutes() >= 56));
            return isSeptember6 && isAfterTime;
        }

        function spawnKiss() { 
            const kiss = document.createElement('div'); 
            
            const trajectoryType = Math.floor(Math.random() * 3); 
            if (trajectoryType === 0) { kiss.className = 'heart fly-straight'; } 
            else if (trajectoryType === 1) { kiss.className = 'heart fly-left'; } 
            else { kiss.className = 'heart fly-right'; } 
            
            let currentImg = ""; 
            
            if (checkAnniversary()) {
                currentImg = (Math.random() < 0.5) ? "confetti.png" : "balloon-hearts.png";
            } else {
                currentImg = (Math.random() < 0.5) ? "kiss.png" : "cat.png";
            }
            
            kiss.innerHTML = `<img src="${currentImg}" alt="kiss">`; 
            kiss.style.left = (Math.random() * 96 + 2) + 'vw'; 
            
            const size = Math.random() * 30 + 35; 
            kiss.style.width = size + 'px'; 
            
            const duration = Math.random() * 2 + 4; 
            kiss.style.animationDuration = duration + 's'; 

            document.body.appendChild(kiss); 
            
            setTimeout(() => { kiss.remove(); }, duration * 1000); 
        } 

        window.addEventListener('DOMContentLoaded', () => { 
            let spawnSpeed = checkAnniversary() ? 80 : 150;
            setInterval(spawnKiss, spawnSpeed); 
        }); 
    </script> 
</body> 
</html>
