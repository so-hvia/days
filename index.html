<!DOCTYPE html> 
<html lang="uk"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Скільки днів я люблю Сашулю</title> 
    <!-- ВИПРАВЛЕНО: Надійне підключення шрифту Manrope з Google Fonts --> 
    <link rel="preconnect" href="https://googleapis.com"> 
    <link rel="preconnect" href="https://gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet"> 
    <link rel="icon" href="calendar.png" type="image/png" sizes="36x36"> 

    <style> 
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #ffffff; 
            font-family: 'Manrope', sans-serif !important; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative; 
        } 

        .container { 
            text-align: center; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
        } 

        /* ОНОВЛЕНО: Трохи зменшили картинку */
        .center-image { 
            max-width: 360px; /* Було 400px, тепер картинка акуратніша */
            width: 100%; 
            height: auto; 
            display: block; 
            margin: 0 auto 20px auto; /* Зменшили відступ знизу */
        } 

        /* Заголовок H1 з білою плашкою */ 
        h1 { 
            font-size: 32px; 
            font-weight: 500 !important; 
            color: #2A2823; 
              margin: 0 auto 0 auto; /* ЗМІНЕНО: Прибрали всі відступи знизу */
            padding: 10px 5px 0 5px; /* ЗМІНЕНО: Зменшили нижній внутрішній відступ */
            background: #ffffff; 
            border-radius: 8px 8px 0 0; /* ЗМІНЕНО: Закруглення тільки зверху */
            display: inline-block; 
        } 

        /* Налаштування вигляду таймера */ 
        .timer-display { 
            font-size: 36px; 
            font-weight: 600 !important; 
            color: #9B0116; 
            letter-spacing: 0.5px; 
            padding: 0 25px 10px 25px; /* ЗМІНЕНО: Зменшили верхній внутрішній відступ */
            margin: 0 auto; /* ЗМІНЕНО: Повністю прибрали зовнішні відступи */
            background: #ffffff; 
            border-radius: 0 0 12px 12px; /* ЗМІНЕНО: Закруглення тільки знизу */
            display: inline-block; 
            transition: transform 0.4s ease; 
            cursor: default; 
             /* НОВИЙ РЯДОК: Робить ширину всіх цифр однаковою і прибирає здригання */
            font-variant-numeric: tabular-nums; 
        } 

        .timer-display span { 
            font-size: 24px; 
            font-weight: 700 !important; 
            color: #9B0116; 
            margin-right: 8px; 
        } 

        /* ВИПРАВЛЕНО: Коментар тепер закривається правильно, не ламаючи код нижче */
        /* 
        .timer-display:hover { 
            animation: wobble-box 0.6s ease-in-out forwards; 
        } 
        @keyframes wobble-box { 
            0% { transform: rotate(0deg); } 
            30% { transform: rotate(3deg); } 
            70% { transform: rotate(-2deg); } 
            100% { transform: rotate(0deg); } 
        } 
        */ 

        /* === НАЛАШТУВАННЯ АНІМАЦІЇ ПОЦІЛУНКІВ (ПОВЕРНУТО З КОМЕНТАРЯ) === */ 
        .heart { 
            position: absolute; 
            bottom: -80px; 
            user-select: none; 
            pointer-events: none; 
            animation: flyAndFade 5s linear forwards; 
        } 

        .heart img { 
            width: 100%; 
            height: auto; 
            display: block; 
        } 
        .fly-straight {
            animation: straightMove 5s linear forwards;
        }

        .fly-left {
            animation: leftMove 5s linear forwards;
        }

        .fly-right {
            animation: rightMove 5s linear forwards;
        }
        .fly-right {
            animation: rightMove 5s linear forwards;
        }

        /* 1. Прямо вгору (з легким елегантним поворотом наприкінці) */
        @keyframes straightMove { 
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; } 
            80% { opacity: 0.3; } 
            100% { transform: translateY(-115vh) rotate(15deg); opacity: 0; } 
        } 

        /* 2. Рівномірна діагональ ЛІВОРУЧ */
        @keyframes leftMove { 
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.9; } 
            80% { opacity: 0.3; } 
            100% { transform: translateY(-115vh) translateX(-15vw) rotate(-35deg); opacity: 0; } 
        } 

        /* 3. Рівномірна діагональ ПРАВОРУЧ */
        @keyframes rightMove { 
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.9; } 
            80% { opacity: 0.3; } 
            100% { transform: translateY(-115vh) translateX(15vw) rotate(35deg); opacity: 0; } 
        } 
       </style> 
</head> 
<body> 

    <div class="container"> 
        <img src="photo.png" alt="Головне зображення" class="center-image"> 
        
        <!-- Заголовок H1 на плашці --> 
        <div> 
            <h1>Я найщасливіша дівчина в світі вже:</h1> 
        </div> 

        <!-- Таймер з плашкою --> 
        <div class="timer-display" id="timer">Завантаження...</div> 
    </div> 

    <script> 
        // const startDate = new Date(Date.UTC(2021, 8, 6, 18, 56, 0)); 
        const startDate = new Date(Date.UTC(2026, 6, 28, 18, 56, 0)); 
        function getPluralWord(number, one, two, many) { 
            let n = Math.abs(number); 
            n %= 100; 
            if (n >= 5 && n <= 20) return many; 
            n %= 10; 
            if (n === 1) return one; 
            if (n >= 2 && n <= 4) return two; 
            return many; 
        } 

        function updateTimer() { 
            const now = new Date(); 
            let diff = now - startDate; 

            if (diff < 0) { 
                document.getElementById('timer').innerHTML = "Вказана дата ще не настала!"; 
                return; 
            } 

            let years = now.getFullYear() - startDate.getFullYear(); 
            let months = now.getMonth() - startDate.getMonth(); 
            let days = now.getDate() - startDate.getDate(); 
            let hours = now.getHours() - startDate.getHours(); 
            let minutes = now.getMinutes() - startDate.getMinutes(); 
            let seconds = now.getSeconds() - startDate.getSeconds(); 

            if (seconds < 0) { seconds += 60; minutes--; } 
            if (minutes < 0) { minutes += 60; hours--; } 
            if (hours < 0) { hours += 24; days--; } 
            if (days < 0) { 
                const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0); 
                days += previousMonth.getDate(); 
                months--; 
            } 
            if (months < 0) { months += 12; years--; } 

            let txtYears = getPluralWord(years, "рік", "роки", "років"); 
            let txtMonths = getPluralWord(months, "місяць", "місяці", "місяців"); 
            let txtDays = getPluralWord(days, "день", "дні", "днів"); 
            let txtHours = getPluralWord(hours, "година", "години", "годин"); 
            let txtMinutes = getPluralWord(minutes, "хвилина", "хвилини", "хвилин"); 
            let txtSeconds = getPluralWord(seconds, "секунда", "секунди", "секунд"); 

            document.getElementById('timer').innerHTML = 
                `${years}<span> ${txtYears}</span> ` + 
                `${months}<span> ${txtMonths}</span> ` + 
                `${days}<span> ${txtDays}</span> ` + 
                `${hours}<span> ${txtHours}</span> ` + 
                `${minutes}<span> ${txtMinutes}</span> ` + 
                `${seconds}<span> ${txtSeconds}</span>`; 
        } 

        updateTimer(); 
        setInterval(updateTimer, 1000); 

            // === ОНОВЛЕНА ФУНКЦІЯ СТВОРЕННЯ ПОЦІЛУНКІВ (2 PNG ДЛЯ ЗВИЧАЙНИХ ДНІВ / 3 PNG ДЛЯ РІЧНИЦІ) === 
        function spawnKiss() { 
            const kiss = document.createElement('div'); 
            
            const trajectoryType = Math.floor(Math.random() * 3); 
            if (trajectoryType === 0) {
                kiss.className = 'heart fly-straight';
            } else if (trajectoryType === 1) {
                kiss.className = 'heart fly-left';
            } else {
                kiss.className = 'heart fly-right';
            }
            
            const now = new Date();
            let currentImg = ""; 
            
            const isSeptember6 = (now.getMonth() === 8 && now.getDate() === 6);
            const isAfterTime = (now.getHours() > 18 || (now.getHours() === 18 && now.getMinutes() >= 56));
            
            // ЛОГІКА ДЛЯ РІЧНИЦІ (3 святкові картинки вперемішку)
            if (isSeptember6 && isAfterTime) {
                const randomChoice = Math.random();
                if (randomChoice < 0.33) {
                    currentImg = "anniversary1.png";
                } else if (randomChoice < 0.66) {
                    currentImg = "anniversary2.png";
                } else {
                    currentImg = "anniversary3.png";
                }
            } 
            // ЛОГІКА ДЛЯ ЗВИЧАЙНИХ ДНІВ (2 різні поцілунки вперемішку)
            else {
                if (Math.random() < 0.5) {
                    currentImg = "kiss.png"; // Перша звичайна картинка
                } else {
                    currentImg = "cat.png"; // Друга звичайна картинка
                }
            }
            
            kiss.innerHTML = `<img src="${currentImg}" alt="kiss">`; 
            kiss.style.left = (Math.random() * 96 + 2) + 'vw'; 
            
            const size = Math.random() * 30 + 35; 
            kiss.style.width = size + 'px'; 
            
            const duration = Math.random() * 2 + 4; 
            kiss.style.animationDuration = duration + 's'; 

            document.body.appendChild(kiss); 
            
            setTimeout(() => { 
                kiss.remove(); 
            }, duration * 1000); 
        } 


        window.addEventListener('DOMContentLoaded', () => { 
            const now = new Date();
            const isSeptember6 = (now.getMonth() === 8 && now.getDate() === 6);
            const isAfterTime = (now.getHours() > 18 || (now.getHours() === 18 && now.getMinutes() >= 56));
            
            // Визначаємо швидкість: якщо річниця — 80мс (дуже густо), якщо звичайний день — 150мс
            let spawnSpeed = (isSeptember6 && isAfterTime) ? 80 : 150;
            
            setInterval(spawnKiss, spawnSpeed); 
        }); 
    </script> 
</body> 
</html>
